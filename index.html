<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Le Cercle Parfait</title>
    
    <!-- Configuration PWA pour iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cercle Parfait">
    <link rel="apple-touch-icon" href="https://img.icons8.com/isometric/512/degrees.png">

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh; /* Hauteur dynamique pour mobiles */
            overflow: hidden;
            padding-top: env(safe-area-inset-top, 20px);
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        #ui {
            text-align: center;
            margin-top: 20px;
            pointer-events: none;
            z-index: 10;
        }

        h1 { 
            margin: 0; 
            font-size: 18px; 
            color: #ff7675; 
            letter-spacing: 3px; 
            text-transform: uppercase;
        }

        #score { 
            font-size: 72px; 
            font-weight: 800; 
            margin-top: 5px; 
            color: #fff; 
            transition: color 0.2s ease;
        }

        #canvas-container {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        #canvas {
            background-color: #1a1a1a;
            border-radius: 32px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            touch-action: none;
        }

        #instructions {
            color: #666;
            font-size: 13px;
            text-align: center;
            padding: 0 20px 10px 20px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>CERCLE PARFAIT</h1>
        <div id="score">-</div>
    </div>

    <div id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>

    <div id="instructions">Dessine un cercle d'un seul trait sur tout l'espace disponible.</div>

    <script>
        const canvas = document.getElementById('canvas');
        const container = document.getElementById('canvas-container');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');

        let points = [];
        let isDrawing = false;

        // Ajuster dynamiquement la taille du canvas à la zone disponible
        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            // Garder un carré adapté au conteneur disponible
            const availableWidth = rect.width - 20;
            const availableHeight = rect.height - 20;
            const size = Math.min(availableWidth, availableHeight);

            canvas.width = size;
            canvas.height = size;
            redraw();
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function redraw() {
            if (points.length === 0) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.stroke();
        }

        // Événements tactiles et souris
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e.touches[0]); });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e.touches[0]); });
        canvas.addEventListener('touchend', stopDrawing);

        function startDrawing(e) {
            isDrawing = true;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            points = [];
            addPoint(e);
        }

        function draw(e) {
            if (!isDrawing) return;
            addPoint(e);
            redraw();
        }

        function addPoint(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            points.push({ x, y });
        }

        function stopDrawing() {
            if (!isDrawing) return;
            isDrawing = false;

            if (points.length < 15) {
                scoreDisplay.innerText = "Trop court !";
                scoreDisplay.style.color = "#666";
                return;
            }

            // 1. CALCUL DU CENTRE DU CERCLE DU JOUEUR (Moyenne des coordonnées)
            let totalX = 0, totalY = 0;
            points.forEach(p => { totalX += p.x; totalY += p.y; });
            const centerX = totalX / points.length;
            const centerY = totalY / points.length;

            // 2. Calculer la distance de chaque point au centre
            let distances = points.map(p => {
                const dx = p.x - centerX;
                const dy = p.y - centerY;
                return Math.sqrt(dx * dx + dy * dy);
            });

            // 3. Calculer le rayon moyen
            const sumDistances = distances.reduce((a, b) => a + b, 0);
            const rMoyen = sumDistances / distances.length;

            // 4. Calculer la régularité du tracé (écart moyen)
            let ecartSomme = distances.reduce((a, d) => a + Math.abs(d - rMoyen), 0);
            let ecartMoyen = ecartSomme / distances.length;

            // 5. Convertir en pourcentage de réussite (0 à 100%)
            let scorePourcent = Math.max(0, 100 - (ecartMoyen * 2.8));

            // 6. Pénalité pour boucle mal fermée
            const premierPoint = points[0];
            const dernierPoint = points[points.length - 1];
            const distanceFermeture = Math.sqrt(
                Math.pow(premierPoint.x - dernierPoint.x, 2) + 
                Math.pow(premierPoint.y - dernierPoint.y, 2)
            );

            if (distanceFermeture > rMoyen * 0.4) {
                scorePourcent *= 0.6; // Pénalité si le cercle reste trop ouvert
            }

            // Affichage du score
            const scoreFinal = Math.round(scorePourcent);
            scoreDisplay.innerText = scoreFinal + "%";

            // Couleur du texte selon la performance
            if (scoreFinal > 90) scoreDisplay.style.color = '#2ecc71';
            else if (scoreFinal > 75) scoreDisplay.style.color = '#f1c40f';
            else scoreDisplay.style.color = '#e74c3c';
        }
    </script>
</body>
</html>

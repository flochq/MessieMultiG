<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Le Cercle Parfait</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #ui {
            text-align: center;
            position: absolute;
            top: 20px;
            pointer-events: none;
        }
        h1 { margin: 0; font-size: 24px; color: #4af; }
        #score { font-size: 48px; font-weight: bold; margin-top: 10px; }
        #canvas {
            background-color: #1e1e1e;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #instructions {
            position: absolute;
            bottom: 40px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>CERCLE PARFAIT</h1>
        <div id="score">Dessine !</div>
    </div>

    <canvas id="canvas"></canvas>

    <div id="instructions">Dessine un cercle d'un seul trait autour du point central.</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');

        // Adapter la taille du canvas à l'écran du téléphone ou PC
        const size = Math.min(window.innerWidth - 40, 400);
        canvas.width = size;
        canvas.height = size;

        const centerX = size / 2;
        const centerY = size / 2;
        let points = [];
        let isDrawing = false;

        // Dessiner le point central au démarrage
        resetCanvas();

        function resetCanvas() {
            ctx.clearRect(0, 0, size, size);
            // Point central
            ctx.beginPath();
            ctx.arc(centerX, centerY, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#4af';
            ctx.fill();
            points = [];
        }

        // Événements tactiles et souris
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e.touches[0]); });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e.touches[0]); });
        canvas.addEventListener('touchend', stopDrawing);

        function startDrawing(e) {
            isDrawing = true;
            resetCanvas();
            addPoint(e);
        }

        function draw(e) {
            if (!isDrawing) return;
            addPoint(e);

            // Dessiner la ligne du joueur
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.stroke();
        }

        function addPoint(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            points.push({ x, y });
        }

        function stopDrawing() {
            if (!isDrawing) return;
            isDrawing = false;

            if (points.length < 10) {
                scoreDisplay.innerText = "Trop court !";
                return;
            }

            // CALCUL DU SCORE
            // 1. Calculer la distance de chaque point par rapport au centre
            let distances = points.map(p => {
                const dx = p.x - centerX;
                const dy = p.y - centerY;
                return Math.sqrt(dx * dx + dy * dy);
            });

            // 2. Calculer le rayon moyen du joueur
            const sum = distances.reduce((a, b) => a + b, 0);
            const rMoyen = sum / distances.length;

            // 3. Calculer l'écart moyen (la régularité)
            let ecartSomme = distances.reduce((a, d) => a + Math.abs(d - rMoyen), 0);
            let ecartMoyen = ecartSomme / distances.length;

            // 4. Convertir en pourcentage de réussite
            // Si l'écart moyen est de 0, c'est 100%. Plus l'écart grandit, plus le score baisse.
            let scorePourcent = Math.max(0, 100 - (ecartMoyen * 2.5));
            
            // Si le cercle n'est pas refermé, on applique une pénalité
            const premierPoint = points[0];
            const dernierPoint = points[points.length - 1];
            const distanceFermeture = Math.sqrt(Math.pow(premierPoint.x - dernierPoint.x, 2) + Math.pow(premierPoint.y - dernierPoint.y, 2));
            if (distanceFermeture > 50) {
                scorePourcent *= 0.7; // -30% si le cercle est grand ouvert
            }

            scoreDisplay.innerText = Math.round(scorePourcent) + "%";

            // Colorer le texte selon le succès
            if (scorePourcent > 90) scoreDisplay.style.color = '#2ecc71'; // Vert
            else if (scorePourcent > 70) scoreDisplay.style.color = '#f1c40f'; // Jaune
            else scoreDisplay.style.color = '#e74c3c'; // Rouge
        }
    </script>
</body>
</html>
